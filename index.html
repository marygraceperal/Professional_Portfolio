<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Restricted Modal</title>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 480px;
            padding: 40px 30px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .modal-icon {
            color: #d87076;
            margin-bottom: 16px;
        }

        .modal-icon svg {
            width: 48px;
            height: 48px;
            fill: currentColor;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 12px 0;
        }

        .modal-description {
            font-size: 0.95rem;
            color: #6b7280;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .contact-container {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #f3f4f6;
        }

        .contact-details {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #374151;
            overflow: hidden;
        }

        .contact-details svg {
            width: 18px;
            height: 18px;
            fill: #d87076;
            flex-shrink: 0;
        }

        .contact-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-link {
            background-color: #d87076;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease;
            flex-shrink: 0;
        }

        .btn-link:hover {
            background-color: #c55d63;
        }

        .btn-close {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-close:hover {
            color: #1f2937;
        }
    </style>
</head>
<body>

    <div class="modal-overlay" id="accessModal">
        <div class="modal-card">
            
            <div class="modal-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 5a3 3 0 0 1 6 0v3H9V7zm3 6a1.5 1.5 0 0 1 1 2.618V18a1 1 0 1 1-2 0v-2.382A1.5 1.5 0 0 1 12 13z"/>
                </svg>
            </div>

            <h2 class="modal-title">Access Restricted</h2>
            <p class="modal-description">Personal documents are private but available to hiring committees and reviewers upon request.</p>

            <div class="contact-container">
                
                <!-- Email Link -->
                <div class="contact-item">
                    <div class="contact-details">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <span class="contact-text">marygraceperal@gmail.com</span>
                    </div>
                    <a href="mailto:marygraceperal@gmail.com?subject=Document%20Access%20Request%20-%20Mary%20Grace%20Peral%20Portfolio&body=Hello%20Mary%20Grace%2C%0D%0A%0D%0AI%20am%20reviewing%20your%20teaching%20portfolio%20and%20would%20like%20to%20request%20access%20to%20your%20restricted%20documents." class="btn-link">Email</a>
                </div>

                <!-- Call Link (Replace +639XXXXXXXXX with your mobile number) -->
                <div class="contact-item">
                    <div class="contact-details">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span class="contact-text">+63 950 638 1725</span>
                    </div>
                    <a href="tel:+639506381725" class="btn-link">Call</a>
                </div>

                <!-- Messenger Link (Replace 'your.username' with your Facebook username) -->
                <div class="contact-item">
                    <div class="contact-details">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.258c0 2.91 1.455 5.512 3.734 7.218V22l3.34-1.834c.937.26 1.93.402 2.926.402 5.523 0 10-4.145 10-9.258S17.523 2 12 2zm1.03 12.381l-2.55-2.72-4.98 2.72 5.48-5.817 2.61 2.72 4.92-2.72-5.48 5.817z"/></svg>
                        <span class="contact-text">Gracey Mondres Peral</span>
                    </div>
                    <a href="https://m.me/graceymondresperal" target="_blank" rel="noopener" class="btn-link">Chat</a>
                </div>

            </div>

            <div>
                <button class="btn-close" onclick="document.getElementById('accessModal').style.display='none'">Close</button>
            </div>

        </div>
    </div>

</body>
</html>
